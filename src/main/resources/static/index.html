<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전표 검문소</title>
<style>
  :root { --bg:#f6f7f5; --fg:#1c2430; --muted:#5d6673; --line:#d6dcdc; --accent:#1f5c5a; --pass:#2a7a4b; --review:#a86f12; --fail:#b3382c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 "Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 20px 60px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  section { background:#fff; border:1px solid var(--line); padding:16px; margin-bottom:16px; }
  h2 { font-size:16px; margin:0 0 10px; }
  form { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
  label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); }
  input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:3px; }
  .actions { grid-column:1/-1; display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; padding:7px 14px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:3px; cursor:pointer; }
  button.secondary { background:#fff; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; font-size:14px; margin-top:8px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; padding:1px 8px; border-radius:3px; font-size:12px; font-family:ui-monospace,Menlo,monospace; }
  .PASS { background:#e3f2e8; color:var(--pass); } .REVIEW { background:#f8edd6; color:var(--review); } .FAIL { background:#f8e3df; color:var(--fail); }
  .findings li { margin:4px 0; } .findings .basis { color:var(--muted); font-size:13px; }
  .status { font-size:13px; color:var(--muted); min-height:1.4em; }
  .err { color:var(--fail); }
  pre { background:#f1f3f2; padding:8px; overflow-x:auto; font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>전표 검문소</h1>
  <p class="sub">거래 설명을 넣으면 작성기가 초안을 쓰고 규칙 13개가 판정한다. 저장과 승인, 역분개, 시산표까지 이 화면에서 부른다. 서버는 같은 주소의 API다.</p>

  <section>
    <h2>1. 거래 설명과 초안</h2>
    <form id="draftForm">
      <label>거래 설명 <input id="description" value="사무용품 카드 구입" required></label>
      <label>전표 일자 <input id="voucherDate" type="date" required></label>
      <label>거래처 <input id="counterpartyName" value="가상문구"></label>
      <label>사업자등록번호 <input id="counterpartyBizNo" placeholder="세금계산서일 때"></label>
      <label>증빙 <select id="evidenceType"><option>CARD</option><option>TAX_INVOICE</option><option>INVOICE</option><option>CASH_RECEIPT</option><option>NONE</option></select></label>
      <label>부가세 구분 <select id="vatType"><option>TAXABLE</option><option>EXEMPT</option><option>ZERO_RATED</option><option>NA</option></select></label>
      <label>공급가액 <input id="supplyAmount" type="number" value="100000" min="0"></label>
      <label>작성자 <input id="preparer" value="김작성" required></label>
      <div class="actions">
        <button type="submit">초안 만들기</button>
        <button type="button" class="secondary" id="saveBtn" disabled>초안 그대로 저장</button>
      </div>
    </form>
    <div class="status" id="draftStatus"></div>
    <div id="draftResult"></div>
  </section>

  <section>
    <h2>2. 승인과 역분개</h2>
    <form id="approveForm">
      <label>전표 id <input id="voucherId" type="number" min="1" required></label>
      <label>승인자 <input id="approver" value="박승인" required></label>
      <label>사유 (REVIEW나 역분개는 필수) <input id="reason"></label>
      <div class="actions">
        <button type="submit">승인</button>
        <button type="button" class="secondary" id="reverseBtn">역분개</button>
        <button type="button" class="secondary" id="loadBtn">조회</button>
      </div>
    </form>
    <div class="status" id="approveStatus"></div>
    <div id="approveResult"></div>
  </section>

  <section>
    <h2>3. 시산표</h2>
    <form id="tbForm">
      <label>월 <input id="month" type="month" required></label>
      <label>범위 <select id="scope"><option value="month">그 달만</option><option value="ytd">연초부터 누계</option></select></label>
      <div class="actions"><button type="submit">시산표 보기</button></div>
    </form>
    <div id="tbResult"></div>
  </section>

  <section>
    <h2>운영자 흐름</h2>
    <p class="sub">규칙 목록은 <a href="/api/rules">/api/rules</a>, 지표는 <a href="/actuator/prometheus">/actuator/prometheus</a>, API 문서는 <a href="/swagger-ui.html">Swagger UI</a>. 작성자는 1번과 저장까지, 승인자는 2번을 맡는다. 작성자가 자기 전표를 승인하면 규칙 R12가 막는다.</p>
  </section>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const today = new Date().toISOString().slice(0, 10);
  $("voucherDate").value = today;
  $("month").value = today.slice(0, 7);
  let lastDraft = null;

  async function call(method, path, body) {
    const res = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = { message: text }; }
    return { status: res.status, data };
  }

  function findingsHtml(validation) {
    if (!validation) return "";
    const items = (validation.findings || []).map(f =>
      `<li><span class="pill ${f.severity}">${f.ruleCode}</span> ${esc(f.message)}<div class="basis">${esc(f.basis || "")}</div></li>`).join("");
    return `<p>판정 <span class="pill ${validation.overall}">${validation.overall}</span></p>` + (items ? `<ul class="findings">${items}</ul>` : "");
  }

  function linesHtml(lines) {
    if (!lines || !lines.length) return "<p>초안 라인이 없다.</p>";
    const rows = lines.map(l => `<tr><td>${l.lineNo}</td><td>${esc(l.accountCode)} ${esc(l.accountName || "")}</td><td>${l.side}</td><td class="num">${Number(l.amount).toLocaleString("ko-KR")}</td><td>${esc(l.memo || "")}</td></tr>`).join("");
    return `<table><thead><tr><th>#</th><th>계정</th><th>차대</th><th>금액</th><th>메모</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function requestBody() {
    const supply = $("supplyAmount").value;
    return {
      description: $("description").value, voucherDate: $("voucherDate").value,
      counterpartyName: $("counterpartyName").value || null, counterpartyBizNo: $("counterpartyBizNo").value || null,
      evidenceType: $("evidenceType").value, vatType: $("vatType").value, supplyAmount: supply === "" ? null : Number(supply)
    };
  }

  $("draftForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("draftStatus").textContent = "초안을 만드는 중";
    const { status, data } = await call("POST", "/api/vouchers/draft", requestBody());
    if (status !== 200) { $("draftStatus").innerHTML = `<span class="err">HTTP ${status} ${esc(data && data.message)}</span>`; return; }
    lastDraft = data;
    $("draftStatus").textContent = `작성기 ${data.drafter}${data.attempts ? ", 호출 " + data.attempts + "회" : ""}. ${data.note || ""}`;
    $("draftResult").innerHTML = linesHtml(data.draft.lines) + findingsHtml(data.validation);
    $("saveBtn").disabled = !(data.draft.lines && data.draft.lines.length);
  });

  $("saveBtn").addEventListener("click", async () => {
    if (!lastDraft) return;
    const body = Object.assign(requestBody(), {
      drafter: lastDraft.drafter, preparer: $("preparer").value,
      lines: lastDraft.draft.lines.map(l => ({ accountCode: l.accountCode, side: l.side, amount: l.amount, memo: l.memo }))
    });
    const { status, data } = await call("POST", "/api/vouchers", body);
    if (status !== 201) { $("draftStatus").innerHTML = `<span class="err">HTTP ${status} ${esc(data && data.message)}</span>`; return; }
    $("draftStatus").textContent = `저장됨. 전표 id ${data.id}, 상태 ${data.status}`;
    $("voucherId").value = data.id;
    $("draftResult").innerHTML = linesHtml(data.lines) + findingsHtml(data.validation);
  });

  function showVoucher(status, data, okStatus, verb) {
    if (status !== okStatus) {
      $("approveStatus").innerHTML = `<span class="err">HTTP ${status} ${esc(data && data.message)}</span>`;
      $("approveResult").innerHTML = data && data.validation ? findingsHtml(data.validation) : "";
      return;
    }
    $("approveStatus").textContent = `${verb} 전표 id ${data.id}, 상태 ${data.status}${data.reversalOfId ? ", 원전표 " + data.reversalOfId : ""}${data.reversedById ? ", 역분개 전표 " + data.reversedById : ""}`;
    $("approveResult").innerHTML = linesHtml(data.lines) + findingsHtml(data.validation);
  }

  $("approveForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const { status, data } = await call("POST", `/api/vouchers/${$("voucherId").value}/approve`, { approver: $("approver").value, reason: $("reason").value || null });
    showVoucher(status, data, 200, "승인됨.");
  });
  $("reverseBtn").addEventListener("click", async () => {
    const { status, data } = await call("POST", `/api/vouchers/${$("voucherId").value}/reverse`, { preparer: $("preparer").value, approver: $("approver").value, reason: $("reason").value });
    showVoucher(status, data, 201, "역분개됨.");
  });
  $("loadBtn").addEventListener("click", async () => {
    const { status, data } = await call("GET", `/api/vouchers/${$("voucherId").value}`);
    showVoucher(status, data, 200, "조회.");
  });

  $("tbForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const { status, data } = await call("GET", `/api/reports/trial-balance?month=${$("month").value}&scope=${$("scope").value}`);
    if (status !== 200) { $("tbResult").innerHTML = `<p class="err">HTTP ${status} ${esc(data && data.message)}</p>`; return; }
    const ytd = data.scope === "ytd";
    const rows = data.rows.map(r => `<tr><td>${esc(r.accountCode)} ${esc(r.accountName || "")}</td>${ytd ? `<td class="num">${Number(r.openingBalance).toLocaleString("ko-KR")}</td>` : ""}<td class="num">${Number(r.debitTotal).toLocaleString("ko-KR")}</td><td class="num">${Number(r.creditTotal).toLocaleString("ko-KR")}</td><td class="num">${Number(r.balance).toLocaleString("ko-KR")}</td><td>${r.balanceSide || ""}</td></tr>`).join("");
    $("tbResult").innerHTML = `<p>${data.month} ${ytd ? "연초부터 누계" : "그 달만"}. 총차변 ${data.totalDebit.toLocaleString("ko-KR")}원, 총대변 ${data.totalCredit.toLocaleString("ko-KR")}원, <span class="pill ${data.balanced ? "PASS" : "FAIL"}">${data.balanced ? "balanced" : "unbalanced"}</span></p>
      <table><thead><tr><th>계정</th>${ytd ? "<th>기초 잔액</th>" : ""}<th>차변 합</th><th>대변 합</th><th>잔액</th><th>잔액 쪽</th></tr></thead><tbody>${rows || "<tr><td colspan='6'>전기된 항목이 없다</td></tr>"}</tbody></table>`;
  });
})();
</script>
</body>
</html>
