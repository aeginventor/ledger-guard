name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run unit, integration, golden set, and mutation tests (H2)
        run: ./gradlew test --no-daemon
      - name: Upload test, golden set, and mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/tests/test
            build/reports/golden-summary.md
            build/reports/mutation-summary.md
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t ledger-guard:ci .
