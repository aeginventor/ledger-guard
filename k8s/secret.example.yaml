# 예시 파일이다. 실제 값은 secret.yaml로 따로 만들고 Git에 올리지 않는다.
# kubectl create secret generic ledger-guard-secret --from-literal=... 로 만들어도 된다.
apiVersion: v1
kind: Secret
metadata:
  name: ledger-guard-secret
  labels:
    app: ledger-guard
type: Opaque
stringData:
  POSTGRES_DB: ledger
  POSTGRES_USER: ledger
  POSTGRES_PASSWORD: change-me
  SPRING_DATASOURCE_USERNAME: ledger
  SPRING_DATASOURCE_PASSWORD: change-me
  OPENAI_API_KEY: ""
