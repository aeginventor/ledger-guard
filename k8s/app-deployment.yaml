apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-guard
  labels:
    app: ledger-guard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-guard
  template:
    metadata:
      labels:
        app: ledger-guard
    spec:
      # DB StatefulSet이 준비되기 전에 앱이 뜨면 Flyway 연결 실패로 종료되고 재시작이 반복된다(kind 실측에서 재시작 2회).
      # compose의 depends_on(condition: service_healthy)에 해당하는 것이 쿠버네티스에는 없으므로 초기화 컨테이너로 DB 포트를 기다린다.
      initContainers:
        - name: wait-for-db
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z ledger-guard-db 5432; do echo waiting for db; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
      containers:
        - name: app
          image: ledger-guard:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: ledger-guard-config
            - secretRef:
                name: ledger-guard-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
