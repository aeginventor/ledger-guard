apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-guard
  labels:
    app: ledger-guard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-guard
  template:
    metadata:
      labels:
        app: ledger-guard
    spec:
      containers:
        - name: app
          image: ledger-guard:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: ledger-guard-config
            - secretRef:
                name: ledger-guard-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
